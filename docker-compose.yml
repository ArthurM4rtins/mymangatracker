services:
  postgres:
    image: postgres:16-alpine
    container_name: mymangatracker-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mymangatracker
      POSTGRES_PASSWORD: mymangatracker
      POSTGRES_DB: mymangatracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymangatracker -d mymangatracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
