<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kidoku</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topo">
      <span class="marca">kidoku</span>
      <!-- Qual servidor esta recebendo a leitura (#148, item 9). O build e
           unico e tenta producao antes do localhost, entao quem testa local
           logado nos dois gravava em producao sem nada na tela dizer. -->
      <span id="ambiente" class="ambiente" hidden></span>
      <a
        id="abrir-site"
        class="discreto"
        href="#"
        target="_blank"
        rel="noreferrer"
        data-i18n="abrirSite"
      ></a>
    </header>

    <main id="conteudo" class="conteudo">
      <p id="estado" class="estado" data-i18n="carregando"></p>

      <form id="formulario" class="formulario" hidden>
        <div class="pagina">
          <span id="pagina-titulo" class="pagina-titulo"></span>
          <!-- A URL que vai para o banco (#142) continua a um toque: escondida por
               padrao porque o reset ja apaga o que subiu, e o registro automatico
               grava sem o popup abrir — mostrar sempre virou ruido (#173). -->
          <button id="ver-link" type="button" class="discreto ver-link" data-i18n="verLink"></button>
          <span id="pagina-url" class="pagina-url" hidden></span>
        </div>

        <label class="campo">
          <span data-i18n="campoObra"></span>
          <input
            id="filtro"
            type="search"
            data-i18n-placeholder="filtroPlaceholder"
            autocomplete="off"
          />
          <select id="obra" size="5"></select>
          <small id="obra-origem" class="discreto" hidden></small>
        </label>

        <label class="campo campo-curto">
          <span data-i18n="campoCapitulo"></span>
          <input id="capitulo" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="—" />
          <small id="origem" class="discreto"></small>
        </label>

        <button id="registrar" type="submit" data-i18n="registrar"></button>
        <p id="resultado" class="resultado" role="status"></p>

        <label class="chave">
          <input id="auto" type="checkbox" />
          <span>
            <span data-i18n="autoRegistro"></span>
            <small class="discreto" data-i18n="autoRegistroAjuda"></small>
          </span>
        </label>
      </form>

      <p id="sem-sessao" class="estado" hidden>
        <span data-i18n="semSessao"></span>
        <a id="entrar" href="#" target="_blank" rel="noreferrer" data-i18n="entrar"></a>
      </p>
    </main>

    <script src="comum.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
